name: deploy_pr
on:
  pull_request:
    branches: [ main ]
permissions: {}
jobs:
  get_config_values:
    uses: NHSDigital/eps-common-workflows/.github/workflows/get-repo-config.yml@e798d5aee897de6f7dc387dd5623fcd9ba4c8929
    with:
      verify_published_from_main_image: false
    permissions:
      attestations: read
      contents: read
      packages: read
  get_commit_message:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      commit_message: ${{ steps.commit_message.outputs.commit_message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get Commit message
        id: commit_message
        run: |
          echo "commit_message=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"
  quality_checks:
    # always run, but only block in the non-skip case
    needs: [ get_config_values ]
    uses: NHSDigital/eps-common-workflows/.github/workflows/quality-checks-devcontainer.yml@8399c1f015c1304e40771cbd8ccc24c7ed48fdbc
    with:
      pinned_image: ${{ needs.get_config_values.outputs.pinned_image }}
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  quality_gate:
    needs: get_commit_message
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Wait for quality checks to succeed
        if: ${{ ! contains(needs.get_commit_message.outputs.commit_message, '#skip-qc')
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;

            // How many times to poll
            const pollTime = 10000; // 10 seconds
            const maxRetries = 120; // 20 minutes at 10 seconds each
            let attempts = 0;

            async function fetchQCJobs() {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: runId
              });
              return data.jobs.filter(job => job.name.startsWith('quality_checks'));
            }

            let qcJobs = await fetchQCJobs();
            while (attempts < maxRetries) {
              const allCompleted = qcJobs.length > 0 && qcJobs.every(qc => qc.status === 'completed');
              if (allCompleted) {
                break;
              }

              attempts++;

              if (qcJobs.length === 0) {
                console.log(`Attempt #${attempts}: no matching quality_checks jobs yet`);
              } else {
                const incompleteJobs = qcJobs
                  .filter(qc => qc.status !== 'completed')
                  .map(qc => `“${qc.name}” status=${qc.status}`)
                  .join(', ');
                console.log(`Attempt #${attempts}: waiting for quality_checks jobs to complete: ${incompleteJobs}`);
              }

              if (attempts >= maxRetries) {
                break;
              }

              await new Promise(r => setTimeout(r, pollTime));
              qcJobs = await fetchQCJobs();
            }

            if (qcJobs.length === 0) {
              core.setFailed(
                `Timed out waiting for a “quality_checks” job (after ${attempts} polls).`
              );
              return;
            }

            for (const qc of qcJobs) {
              if (qc.status !== 'completed') {
                core.setFailed(
                  `Quality checks job ${qc.name} never completed (last status=${qc.status})`
                );
                return;
              }
            }

            for (const qc of qcJobs) {
              if (qc.conclusion !== 'success' && qc.conclusion !== 'skipped') {
                core.setFailed(
                  `Quality checks job ${qc.name} failed (conclusion=${qc.conclusion}).`
                );
                return;
              }
            }
      - name: Bypass QC gate
        if: ${{ contains(needs.get_commit_message.outputs.commit_message, '#skip-qc') }}
        run: echo "Skipping QC gate per commit message."
  pr_title_format_check:
    uses: NHSDigital/eps-common-workflows/.github/workflows/pr_title_check.yml@e798d5aee897de6f7dc387dd5623fcd9ba4c8929
    permissions:
      pull-requests: write

  tag_release:
    needs: [ get_config_values ]
    uses: NHSDigital/eps-common-workflows/.github/workflows/tag-release-devcontainer.yml@e798d5aee897de6f7dc387dd5623fcd9ba4c8929
    permissions:
      id-token: write
      contents: write
      packages: write
    with:
      dry_run: true
      pinned_image: ${{ needs.get_config_values.outputs.pinned_image }}
      branch_name: ${{ github.event.pull_request.head.ref }}
      tag_format: ${{ needs.get_config_values.outputs.tag_format }}

  package_code:
    needs: [ quality_gate, get_config_values ]
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/cdk_package_code.yml
    with:
      pinned_image: ${{ needs.get_config_values.outputs.pinned_image }}

  release_code:
    needs: [ package_code, get_config_values ]
    uses: ./.github/workflows/release_all_stacks.yml
    permissions:
      contents: write
      id-token: write
    with:
      pinned_image: ${{ needs.get_config_values.outputs.pinned_image }}
      SERVICE_NAME: cpt-ui-pr-${{ github.event.pull_request.number }}
      TARGET_ENVIRONMENT: dev-pr
      VERSION_NUMBER: PR-${{ github.event.pull_request.number }}
      COMMIT_ID: "static-pr"
      useMockOidc: true
      JWT_KID: "eps-cpt-ui-dev"
      LOG_LEVEL: "DEBUG"
      RUN_REGRESSION_TESTS: true
      REACT_LOG_LEVEL: "debug"
      LOG_RETENTION_IN_DAYS: 30
      IS_PULL_REQUEST: true
    secrets: inherit
  report_deployed_url:
    needs: [ release_code ]
    runs-on: ubuntu-22.04
    steps:
      - name: Report Deployed URL
        run: |
          echo "Deployed URL: https://cpt-ui-pr-${ISSUE_NUMBER}.dev.eps.national.nhs.uk" >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
